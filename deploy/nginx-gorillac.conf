# gorillac.net — nginx server block (runs on the Proxmox host at 192.168.0.84,
# behind a Cloudflare Tunnel). Install to /etc/nginx/conf.d/gorillac.conf, then:
#   nginx -t && systemctl reload nginx
#
# TLS terminates at Cloudflare, so this block listens plain-HTTP for cloudflared
# to proxy into. Every response still carries the security headers below, because
# Cloudflare passes origin headers through untouched.
#
# PORT 80, NOT 8080: /etc/cloudflared/config.yml routes gorillac.net to
# http://localhost:80. This box also serves usepayvio.com and proprunners.com
# from that same port, so this block is name-based on server_name only — do NOT
# add `default_server` here or it will start answering for those hostnames too.
#
# THIS REPLACES the previous gorillac.net block. Two blocks with the same
# server_name on the same port is a "conflicting server name" warning and the
# second one is ignored — delete the old one rather than running both.

server {
    listen      80;
    server_name gorillac.net www.gorillac.net;

    root  /opt/gorillac;
    index index.html;

    # ── Security headers ────────────────────────────────────────────────────
    # `always` so they are emitted on error responses (404/50x) too, not just 200s.

    # Force HTTPS for two years, including subdomains. Only meaningful because
    # Cloudflare serves this zone over HTTPS — remove `preload` unless you have
    # actually submitted the domain to hstspreload.org.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Stop MIME sniffing.
    add_header X-Content-Type-Options "nosniff" always;

    # No framing — this site is never embedded anywhere.
    add_header X-Frame-Options "DENY" always;

    # Don't leak full URLs to third parties (Google Fonts, cdnjs).
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # This is a static brochure site; it needs none of these.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

    # CSP matched to what the pages actually load:
    #   styles  — inline <style> blocks + Google Fonts + cdnjs (Font Awesome)
    #   fonts   — fonts.gstatic.com (Google) + cdnjs (Font Awesome webfonts)
    #   scripts — inline <script> blocks only; no external JS is loaded
    #   images  — self + data: URIs (the SVG film-grain texture)
    # 'unsafe-inline' is required for both style-src and script-src because the
    # CSS and JS live inline in each page. Moving them to external files would
    # let you drop it; until then this is the honest policy.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;

    # ── Caching ─────────────────────────────────────────────────────────────
    # CRITICAL — use `expires`, never `add_header Cache-Control`, in these
    # location blocks. nginx inherits add_header from the server level ONLY IF
    # the current level defines no add_header of its own. A single
    # `add_header Cache-Control ...` here would silently discard all six
    # security headers above for every file it matches — i.e. every page on the
    # site. `expires` sets Cache-Control without touching that inheritance.

    # HTML revalidates every request so a deploy is visible immediately.
    location ~* \.html$ {
        expires -1;
    }

    # projects.json drives the portfolio page — it is content, not a static
    # asset. The previous config matched `json` in its 30-day `expires` rule,
    # so edits stayed invisible to returning visitors for up to a month: the
    # browser never re-requested the file. `expires -1` still permits a cheap
    # 304 when nothing changed; it does not disable caching.
    location ~* \.(json|xml|txt)$ {
        expires -1;
    }

    # Images and fonts change rarely and are safe to hold briefly. Renaming a
    # replaced image (avatar-v2.webp) is still the reliable way to force an
    # update, since there is no cache-busting fingerprint in these filenames.
    location ~* \.(png|jpg|jpeg|webp|ico|svg|woff2?)$ {
        expires 7d;
    }

    # ── Routing ─────────────────────────────────────────────────────────────
    # Serve /resume as well as /resume.html.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Don't serve editor/VCS leftovers if any ever land in the web root.
    location ~ /\.(git|env|directory) {
        deny all;
        return 404;
    }

    access_log /var/log/nginx/gorillac.access.log;
    error_log  /var/log/nginx/gorillac.error.log;
}
